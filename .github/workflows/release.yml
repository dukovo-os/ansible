# A tag vVERSION, of the version galaxy.yml gives, releases the collection: the
# tarball `ansible-galaxy collection build` makes is attached to a GitHub
# release of the tag, with its SHA-256, which Dukovo's ansible.lock pins.
# Nothing is published to Ansible Galaxy.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Build and release the collection
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ansible-core
        run: python -m pip install "ansible-core==2.22.*"

      - name: Check that the tag is galaxy.yml's version
        run: |
          version=$(sed -n 's/^version: *//p' galaxy.yml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME, but galaxy.yml says version $version." >&2
            exit 1
          fi

      - name: Build the tarball
        run: ansible-galaxy collection build --output-path dist

      - name: Release it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          tarball="dist/dukovo-system-$version.tar.gz"
          sum=$(sha256sum "$tarball" | cut -d' ' -f1)
          printf 'The collection dukovo.system %s, as `ansible-galaxy collection build` made it from %s.\n\nSHA-256 of %s: `%s`\n' \
            "$version" "$GITHUB_SHA" "${tarball#dist/}" "$sum" > notes.md
          gh release create "$GITHUB_REF_NAME" "$tarball" --title "dukovo.system $version" --notes-file notes.md
